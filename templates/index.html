<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f8;
        }

        h1, h2 {
            color: #333333;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        input {
            padding: 8px;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            background-color: white;
        }

        #greeting {
            margin-top: 15px;
            padding: 10px;
            color: #166534;
            font-weight: bold;
        }

        hr {
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #dddddd;
        }
    </style>
</head>

<body>
    <h1>Student API Interface</h1>

    <button onclick="loadStudent()">Load Student Information</button>

    <div id="result"></div>

    <hr>

    <h2>Greeting API</h2>

    <input type="text" id="nameInput" placeholder="Enter your first name">
    <button onclick="sayHello()">Say Hello</button>

    <p id="greeting"></p>

    <script>
        function loadStudent() {
            fetch('/student')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load student information');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').textContent =
                        'Unable to retrieve student information.';
                });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value.trim();

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to retrieve greeting');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('greeting').innerText = data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText =
                        'Unable to retrieve greeting.';
                });
        }
    </script>
</body>
</html>
