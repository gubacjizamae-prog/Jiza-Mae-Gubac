<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 25px 15px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1, h2 { color: #1d4ed8; }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 12px 0 5px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 12px 5px 0 0;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .add { background: #16a34a; }
        .edit { background: #2563eb; }
        .delete { background: #dc2626; }
        .clear { background: #64748b; }
        .select { background: #7c3aed; }

        .student {
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .student p { margin: 7px 0; }

        #message {
            display: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
        }

        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }

        .hint { color: #64748b; font-size: 14px; }
    </style>
</head>

<body>
<div class="container">

    <h1>Student Management System</h1>
    <p>Manage student records using Flask API and SQLite.</p>

    <section class="card">
        <h2>Add / Edit Student</h2>
        <p class="hint">Select a student from the list to edit or delete it.</p>

        <form id="studentForm">
            <label for="databaseId">Database ID</label>
            <input type="number" id="databaseId"
                   placeholder="Automatically filled when selecting a student"
                   min="1">

            <label for="student_id">Student ID</label>
            <input type="text" id="student_id"
                   placeholder="Example: 2026-00106" required>

            <label for="name">Name</label>
            <input type="text" id="name"
                   placeholder="Enter full name" required>

            <label for="program">Program</label>
            <input type="text" id="program"
                   placeholder="Example: BSIT" required>

            <label for="year">Year</label>
            <select id="year" required>
                <option value="">Select year level</option>
                <option value="1">Year 1</option>
                <option value="2">Year 2</option>
                <option value="3">Year 3</option>
                <option value="4">Year 4</option>
            </select>

            <label for="section">Section</label>
            <input type="text" id="section"
                   placeholder="Example: A" required>

            <button type="submit" class="add">Add Student</button>
            <button type="button" class="edit" onclick="editStudent()">
                Edit Student
            </button>
            <button type="button" class="delete" onclick="deleteStudent()">
                Delete Student
            </button>
            <button type="button" class="clear" onclick="clearForm()">
                Clear Form
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
        <h2>Student Records</h2>
        <button type="button" class="edit" onclick="loadStudents()">
            Refresh Student List
        </button>
        <div id="studentList">Loading student records...</div>
    </section>

</div>

<script>
    const form = document.getElementById('studentForm');
    const studentList = document.getElementById('studentList');
    const message = document.getElementById('message');

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.className = isError ? 'error' : 'success';
        message.style.display = 'block';
    }

    function getStudentData() {
        return {
            student_id: document.getElementById('student_id').value.trim(),
            name: document.getElementById('name').value.trim(),
            program: document.getElementById('program').value.trim(),
            year: Number(document.getElementById('year').value),
            section: document.getElementById('section').value.trim()
        };
    }

    function validateStudent(data) {
        if (!data.student_id || !data.name || !data.program ||
            !data.year || !data.section) {
            showMessage('Please fill in all student fields.', true);
            return false;
        }
        return true;
    }

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, options);
        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || 'Request failed.');
        }
        return result;
    }

    // CREATE: Add a student using POST
    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        const studentData = getStudentData();
        if (!validateStudent(studentData)) return;

        try {
            const result = await apiRequest('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            });

            showMessage(`${result.message}. Database ID: ${result.id}`);
            clearForm(false);
            await loadStudents();
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    // READ: Load all students
    async function loadStudents() {
        studentList.textContent = 'Loading student records...';

        try {
            const students = await apiRequest('/students');
            studentList.replaceChildren();

            if (students.length === 0) {
                studentList.textContent = 'No student records found.';
                return;
            }

            students.forEach(student => {
                const card = document.createElement('div');
                card.className = 'student';

                [
                    ['Database ID', student.id],
                    ['Student ID', student.student_id],
                    ['Name', student.name],
                    ['Program', student.program],
                    ['Year', student.year],
                    ['Section', student.section]
                ].forEach(([label, value]) => {
                    const p = document.createElement('p');
                    const strong = document.createElement('strong');
                    strong.textContent = label + ': ';
                    p.appendChild(strong);
                    p.appendChild(document.createTextNode(String(value)));
                    card.appendChild(p);
                });

                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'select';
                button.textContent = 'Select';
                button.addEventListener('click', () => selectStudent(student));

                card.appendChild(button);
                studentList.appendChild(card);
            });
        } catch (error) {
            studentList.textContent = 'Unable to load student records.';
            showMessage(error.message, true);
        }
    }

    // Select a student for editing or deleting
    function selectStudent(student) {
        document.getElementById('databaseId').value = student.id;
        document.getElementById('student_id').value = student.student_id;
        document.getElementById('name').value = student.name;
        document.getElementById('program').value = student.program;
        document.getElementById('year').value = student.year;
        document.getElementById('section').value = student.section;

        showMessage(`Selected ${student.name}, Database ID ${student.id}.`);
        form.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // UPDATE: Edit a student using PUT
    async function editStudent() {
        const id = document.getElementById('databaseId').value;
        const studentData = getStudentData();

        if (!id) {
            showMessage('Please select a student to edit.', true);
            return;
        }

        if (!validateStudent(studentData)) return;

        try {
            const result = await apiRequest(`/api/students/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            });

            showMessage(result.message);
            clearForm(false);
            await loadStudents();
        } catch (error) {
            showMessage(error.message, true);
        }
    }

    // DELETE: Delete a student using DELETE
    async function deleteStudent() {
        const id = document.getElementById('databaseId').value;

        if (!id) {
            showMessage('Please select a student to delete.', true);
            return;
        }

        if (!confirm('Are you sure you want to delete this student?')) return;

        try {
            const result = await apiRequest(`/api/students/${id}`, {
                method: 'DELETE'
            });

            showMessage(result.message);
            clearForm(false);
            await loadStudents();
        } catch (error) {
            showMessage(error.message, true);
        }
    }

    // Clear the form
    function clearForm(hideMessage = true) {
        form.reset();
        document.getElementById('databaseId').value = '';

        if (hideMessage) {
            message.style.display = 'none';
        }
    }

    // Load records when the page opens
    loadStudents();
</script>
</body>
